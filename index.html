<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royalty-Free Media Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            padding: 30px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-input {
            position: relative;
        }

        .search-input input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-input input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-input input::placeholder {
            color: #999;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-search:active {
            transform: translateY(0);
        }

        .btn-search.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn-clear {
            background: #f0f0f0;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-clear:hover {
            background: #e0e0e0;
        }

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-group label {
            font-weight: 600;
            color: #555;
        }

        .filter-group select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95em;
            cursor: pointer;
            background: white;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .results-section {
            padding: 30px 20px;
            min-height: 200px;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
            gap: 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1em;
            color: #666;
            font-weight: 500;
        }

        .error-state {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .error-state h3 {
            color: #856404;
            margin-bottom: 10px;
        }

        .error-state p {
            color: #856404;
            margin-bottom: 10px;
        }

        .error-details {
            background: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: 'Courier New', monospace;
            color: #666;
            overflow-x: auto;
            margin-top: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .media-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .media-card:hover {
            border-color: #667eea;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.15);
            transform: translateY(-5px);
        }

        .media-thumbnail {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #999;
            position: relative;
            overflow: hidden;
        }

        .media-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-type-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(102, 126, 234, 0.9);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .media-content {
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .media-title {
            font-weight: 600;
            font-size: 1em;
            margin-bottom: 8px;
            color: #333;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .media-description {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }

        .media-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.8em;
            color: #999;
            margin-bottom: 10px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .media-actions {
            display: flex;
            gap: 8px;
        }

        .btn-small {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85em;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            color: #667eea;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-small:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination .page-info {
            color: #666;
            font-weight: 500;
            margin: 0 10px;
        }

        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
        }

        .results-count {
            font-weight: 600;
            color: #333;
        }

        .results-filter {
            font-size: 0.9em;
            color: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #666;
            padding: 0;
            width: 30px;
            height: 30px;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-detail-item {
            margin-bottom: 15px;
        }

        .modal-detail-label {
            font-weight: 600;
            color: #667eea;
            font-size: 0.9em;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .modal-detail-value {
            color: #333;
            word-break: break-word;
        }

        .modal-detail-value a {
            color: #667eea;
            text-decoration: none;
        }

        .modal-detail-value a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .search-controls {
                grid-template-columns: 1fr;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .results-info {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .pagination {
                flex-wrap: wrap;
            }
        }

        .stats-bar {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 1.5em;
            font-weight: bold;
        }

        .stat-label {
            font-size: 0.85em;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Royalty-Free Media Search</h1>
            <p>Discover and explore royalty-free media resources</p>
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-value" id="totalResults">0</span>
                    <span class="stat-label">Total Results</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="currentPage">1</span>
                    <span class="stat-label">Page</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="searchTime">-</span>
                    <span class="stat-label">Search Time</span>
                </div>
            </div>
        </header>

        <div class="search-section">
            <div class="search-controls">
                <div class="search-input">
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search royalty-free media (images, music, videos, fonts)..."
                        autocomplete="off"
                    >
                </div>
                <button class="btn-search" id="searchBtn">Search</button>
                <button class="btn-clear" id="clearBtn">Clear</button>
            </div>
            
            <div class="filters">
                <div class="filter-group">
                    <label for="mediaType">Type:</label>
                    <select id="mediaType">
                        <option value="">All Types</option>
                        <option value="image">Images</option>
                        <option value="music">Music</option>
                        <option value="video">Videos</option>
                        <option value="font">Fonts</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="sortBy">Sort:</label>
                    <select id="sortBy">
                        <option value="relevance">Relevance</option>
                        <option value="latest">Latest</option>
                        <option value="popular">Popular</option>
                        <option value="name">Name (A-Z)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="resultsPerPage">Per Page:</label>
                    <select id="resultsPerPage">
                        <option value="12">12</option>
                        <option value="24">24</option>
                        <option value="36">36</option>
                        <option value="48">48</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="results-section">
            <div id="resultsContainer"></div>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle"></h2>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script>
        // Application State
        const state = {
            results: [],
            currentPage: 1,
            totalResults: 0,
            searchQuery: '',
            mediaType: '',
            sortBy: 'relevance',
            resultsPerPage: 12,
            loading: false,
            error: null,
            searchTime: 0
        };

        // DOM Elements
        const elements = {
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            clearBtn: document.getElementById('clearBtn'),
            mediaType: document.getElementById('mediaType'),
            sortBy: document.getElementById('sortBy'),
            resultsPerPage: document.getElementById('resultsPerPage'),
            resultsContainer: document.getElementById('resultsContainer'),
            detailModal: document.getElementById('detailModal'),
            modalTitle: document.getElementById('modalTitle'),
            modalBody: document.getElementById('modalBody'),
            closeModal: document.getElementById('closeModal'),
            totalResults: document.getElementById('totalResults'),
            currentPage: document.getElementById('currentPage'),
            searchTime: document.getElementById('searchTime')
        };

        // Mock Data - Royalty-Free Media Resources
        const mockMediaData = [
            {
                id: 1,
                title: 'Beautiful Sunset Over Mountains',
                type: 'image',

            },
            {

                source: 'Free Music Archive',
                url: 'https://freemusicarchive.org',

                downloads: 3420,

            },
            {
                id: 3,
                title: 'Urban City Cinematic B-Roll',
                type: 'video',

                source: 'Pexels Videos',
                url: 'https://pexels.com/videos',

                downloads: 890,

            },
            {
                id: 4,
                title: 'Modern Sans-Serif Font',
                type: 'font',
                description: 'Clean and modern font suitable for web and print design',
                source: 'Google Fonts',
                url: 'https://fonts.google.com',
                tags: ['sans-serif', 'modern', 'clean'],
                downloads: 5670,
                createdAt: '2024-12-07'
            },
            {
                id: 5,
                title: 'Ocean Waves Abstract',
                type: 'image',
                description: 'Abstract art inspired by ocean waves and water patterns',
                source: 'Pixabay',
                url: 'https://pixabay.com',
                tags: ['abstract', 'ocean', 'water'],
                downloads: 2100,
                createdAt: '2024-12-06'
            },
            {
                id: 6,
                title: 'Upbeat Electronic Track',
                type: 'music',
                description: 'Energetic electronic music for marketing videos',
                source: 'Incompetech',
                url: 'https://incompetech.com',
                tags: ['electronic', 'upbeat', 'energetic'],
                downloads: 4200,
                createdAt: '2024-12-05'
            },
            {
                id: 7,
                title: 'Nature Documentary Footage',
                type: 'video',
                description: 'Beautiful footage of wildlife in natural habitats',
                source: 'Videezy',
                url: 'https://videezy.com',
                tags: ['nature', 'wildlife', 'documentary'],
                downloads: 1560,
                createdAt: '2024-12-04'
            },
            {
                id: 8,
                title: 'Serif Display Font',
                type: 'font',
                description: 'Elegant serif font perfect for headings and titles',
                source: 'Font Squirrel',
                url: 'https://fontsquirrel.com',
                tags: ['serif', 'elegant', 'display'],
                downloads: 3850,
                createdAt: '2024-12-03'
            },
            {
                id: 9,
                title: 'Colorful Flowers Garden',
                type: 'image',
                description: 'Vibrant garden filled with colorful blooming flowers',
                source: 'Unsplash',
                url: 'https://unsplash.com',
                tags: ['flowers', 'garden', 'nature'],
                downloads: 2890,
                createdAt: '2024-12-02'
            },
            {
                id: 10,
                title: 'Cinematic Piano Score',
                type: 'music',
                description: 'Dramatic piano composition for film and media projects',
                source: 'YouTube Audio Library',
                url: 'https://www.youtube.com/audiolibrary',
                tags: ['piano', 'cinematic', 'dramatic'],
                downloads: 5200,
                createdAt: '2024-12-01'
            },
            {
                id: 11,
                title: 'Corporate Office Timelapse',
                type: 'video',
                description: 'Modern timelapse of busy corporate office environment',
                source: 'Pexels Videos',
                url: 'https://pexels.com/videos',
                tags: ['corporate', 'office', 'timelapse'],
                downloads: 1200,
                createdAt: '2024-11-30'
            },
            {
                id: 12,
                title: 'Monospace Code Font',
                type: 'font',
                description: 'Professional monospace font for code editors and terminals',
                source: 'GitHub Fonts',
                url: 'https://github.com/fonts',
                tags: ['monospace', 'code', 'programming'],
                downloads: 7200,
                createdAt: '2024-11-29'
            }
        ];

        // Helper Functions
        function debounce(func, delay) {
            let timeoutId;
            return function (...args) {
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => func(...args), delay);
            };
        }

        function showError(message, details = '') {
            state.error = { message, details };
            renderResults();
        }

        function clearError() {
            state.error = null;
        }

        function setLoading(loading) {
            state.loading = loading;
            elements.searchBtn.classList.toggle('loading', loading);
            elements.searchBtn.disabled = loading;
        }

        // Search and Filter Functions
        function filterResults() {
            let filtered = [...mockMediaData];

            // Apply search query
            if (state.searchQuery) {
                const query = state.searchQuery.toLowerCase();
                filtered = filtered.filter(item =>
                    item.title.toLowerCase().includes(query) ||
                    item.description.toLowerCase().includes(query) ||
                    item.tags.some(tag => tag.toLowerCase().includes(query))
                );
            }

            // Apply media type filter
            if (state.mediaType) {
                filtered = filtered.filter(item => item.type === state.mediaType);
            }

            // Apply sorting
            switch (state.sortBy) {
                case 'latest':
                    filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
                    break;
                case 'popular':
                    filtered.sort((a, b) => b.downloads - a.downloads);
                    break;
                case 'name':
                    filtered.sort((a, b) => a.title.localeCompare(b.title));
                    break;
                case 'relevance':
                default:
                    // Keep original order for relevance
                    break;
            }

            state.results = filtered;
            state.totalResults = filtered.length;
            state.currentPage = 1;
        }

        function getPaginatedResults() {
            const startIndex = (state.currentPage - 1) * state.resultsPerPage;
            const endIndex = startIndex + state.resultsPerPage;
            return state.results.slice(startIndex, endIndex);
        }

        function getTotalPages() {
            return Math.ceil(state.totalResults / state.resultsPerPage);
        }

        // Rendering Functions
        function renderMediaCard(item) {
            const typeEmojis = {
                image: '🖼️',
                music: '🎵',
                video: '🎬',
                font: '✍️'
            };

            return `
                <div class="media-card" onclick="showDetails(${item.id})">
                    <div class="media-thumbnail">
                        ${typeEmojis[item.type] || '📄'}
                        <span class="media-type-badge">${item.type}</span>
                    </div>
                    <div class="media-content">
                        <div class="media-title">${escapeHtml(item.title)}</div>
                        <div class="media-description">${escapeHtml(item.description)}</div>
                        <div class="media-meta">
                            <span class="meta-item">📊 ${item.downloads.toLocaleString()} downloads</span>
                            <span class="meta-item">🏷️ ${item.source}</span>
                        </div>
                        <div class="media-actions">
                            <button class="btn-small" onclick="openLink('${item.url}', event)">Visit</button>
                            <button class="btn-small" onclick="copyToClipboard('${item.url}', event)">Copy</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderError() {
            return `
                <div class="error-state">
                    <h3>⚠️ Error</h3>
                    <p>${escapeHtml(state.error.message)}</p>
                    ${state.error.details ? `<div class="error-details">${escapeHtml(state.error.details)}</div>` : ''}
                </div>
            `;
        }

        function renderLoading() {
            return `
                <div class="loading-state">
                    <div class="spinner"></div>
                    <div class="loading-text">Searching media resources...</div>
                </div>
            `;
        }

        function renderEmpty() {
            return `
                <div class="empty-state">
                    <div style="font-size: 3em; margin-bottom: 10px;">🔍</div>
                    <h3>No Results Found</h3>
                    <p>Try adjusting your search criteria or filters</p>
                </div>
            `;
        }

        function renderResults() {
            let html = '';

            // Error state
            if (state.error) {
                html += renderError();
            }

            // Loading state
            if (state.loading) {
                html += renderLoading();
            } else if (!state.error) {
                // Results info
                if (state.totalResults > 0) {
                    html += `
                        <div class="results-info">
                            <div class="results-count">
                                Showing ${(state.currentPage - 1) * state.resultsPerPage + 1}-${Math.min(state.currentPage * state.resultsPerPage, state.totalResults)} of ${state.totalResults} results
                            </div>
                            ${state.searchQuery ? `<div class="results-filter">for: <strong>${escapeHtml(state.searchQuery)}</strong></div>` : ''}
                        </div>
                    `;
                }

                // Results grid
                const paginatedResults = getPaginatedResults();
                if (paginatedResults.length > 0) {
                    html += '<div class="results-grid">';
                    paginatedResults.forEach(item => {
                        html += renderMediaCard(item);
                    });
                    html += '</div>';

                    // Pagination
                    const totalPages = getTotalPages();
                    if (totalPages > 1) {
                        html += `
                            <div class="pagination">
                                <button onclick="previousPage()" ${state.currentPage === 1 ? 'disabled' : ''}>← Previous</button>
                                <span class="page-info">Page ${state.currentPage} of ${totalPages}</span>
                                <button onclick="nextPage()" ${state.currentPage === totalPages ? 'disabled' : ''}>Next →</button>
                            </div>
                        `;
                    }
                } else if (!state.loading && state.totalResults === 0) {
                    html += renderEmpty();
                }
            }

            elements.resultsContainer.innerHTML = html;
            updateStats();
        }

        function updateStats() {
            elements.totalResults.textContent = state.totalResults;
            elements.currentPage.textContent = state.currentPage;
            if (state.searchTime > 0) {
                elements.searchTime.textContent = state.searchTime + 'ms';
            }
        }

        // Search Handler
        async function performSearch() {
            const startTime = performance.now();
            
            state.searchQuery = elements.searchInput.value.trim();
            state.mediaType = elements.mediaType.value;
            state.sortBy = elements.sortBy.value;
            state.resultsPerPage = parseInt(elements.resultsPerPage.value);
            
            clearError();
            setLoading(true);

            try {
                // Simulate API call delay
                await new Promise(resolve => setTimeout(resolve, 500));

                if (!state.searchQuery && !state.mediaType) {
                    showError('Please enter a search term or select a media type', 'At least one search criterion is required');
                    return;
                }

                filterResults();
                state.searchTime = Math.round(performance.now() - startTime);
                
            } catch (error) {
                showError(
                    'Search failed: ' + error.message,
                    JSON.stringify(error, null, 2)
                );
            } finally {
                setLoading(false);
                renderResults();
            }
        }

        // Event Listeners
        elements.searchBtn.addEventListener('click', performSearch);
        elements.searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        elements.clearBtn.addEventListener('click', () => {
            elements.searchInput.value = '';
            elements.mediaType.value = '';
            elements.sortBy.value = 'relevance';
            elements.resultsPerPage.value = '12';
            state.results = [];
            state.totalResults = 0;
            state.currentPage = 1;
            clearError();
            renderResults();
        });

        elements.mediaType.addEventListener('change', debounce(() => {
            if (state.searchQuery || state.mediaType) {
                performSearch();
            }
        }, 300));

        elements.sortBy.addEventListener('change', () => {
            if (state.results.length > 0) {
                filterResults();
                renderResults();
            }
        });

        elements.resultsPerPage.addEventListener('change', () => {
            state.resultsPerPage = parseInt(elements.resultsPerPage.value);
            state.currentPage = 1;
            renderResults();
        });

        // Modal Functions
        function showDetails(id) {
            const item = mockMediaData.find(m => m.id === id);
            if (!item) return;

            const typeLabel = {
                image: 'Image',
                music: 'Music',
                video: 'Video',
                font: 'Font'
            };

            elements.modalTitle.textContent = item.title;
            elements.modalBody.innerHTML = `
                <div class="modal-detail-item">
                    <div class="modal-detail-label">Type</div>
                    <div class="modal-detail-value">${typeLabel[item.type]}</div>
                </div>
                <div class="modal-detail-item">
                    <div class="modal-detail-label">Description</div>
                    <div class="modal-detail-value">${escapeHtml(item.description)}</div>
                </div>
                <div class="modal-detail-item">
                    <div class="modal-detail-label">Source</div>
                    <div class="modal-detail-value">${escapeHtml(item.source)}</div>
                </div>
                <div class="modal-detail-item">
                    <div class="modal-detail-label">URL</div>
                    <div class="modal-detail-value"><a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.url}</a></div>
                </div>
                <div class="modal-detail-item">
                    <div class="modal-detail-label">Tags</div>
                    <div class="modal-detail-value">${item.tags.map(tag => `<code>${escapeHtml(tag)}</code>`).join(' ')}</div>
                </div>
                <div class="modal-detail-item">
                    <div class="modal-detail-label">Downloads</div>
                    <div class="modal-detail-value">${item.downloads.toLocaleString()}</div>
                </div>
                <div class="modal-detail-item">
                    <div class="modal-detail-label">Created</div>
                    <div class="modal-detail-value">${new Date(item.createdAt).toLocaleDateString()}</div>
                </div>
            `;
            elements.detailModal.classList.add('active');
        }

        function closeDetail() {
            elements.detailModal.classList.remove('active');
        }

        elements.closeModal.addEventListener('click', closeDetail);
        elements.detailModal.addEventListener('click', (e) => {
            if (e.target === elements.detailModal) closeDetail();
        });

        // Pagination Functions
        function nextPage() {
            if (state.currentPage < getTotalPages()) {
                state.currentPage++;
                renderResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function previousPage() {
            if (state.currentPage > 1) {
                state.currentPage--;
                renderResults();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Utility Functions
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function openLink(url, event) {
            event.stopPropagation();
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function copyToClipboard(text, event) {
            event.stopPropagation();
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                showError('Failed to copy to clipboard', err.message);
            });
        }

        // Initialize
        renderResults();
    </script>
</body>
</html>
