<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royalty-Free Media Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        .search-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.9em;
        }

        input[type="text"],
        select {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-button-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .filter-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        .chip {
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .chip:hover {
            background: #e0e0e0;
        }

        .chip-remove {
            font-weight: bold;
            cursor: pointer;
        }

        .results-info {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .results-count {
            font-size: 1.1em;
            color: #333;
        }

        .results-count strong {
            color: #667eea;
        }

        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            animation: fadeIn 0.6s ease-out 0.4s both;
        }

        .media-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .media-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .media-thumbnail {
            width: 100%;
            height: 200px;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            color: #ddd;
            overflow: hidden;
        }

        .media-thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .media-info {
            padding: 20px;
        }

        .media-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-type {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .media-license {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 10px;
        }

        .media-source {
            font-size: 0.8em;
            color: #999;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            animation: fadeIn 0.6s ease-out 0.6s both;
        }

        .pagination button {
            padding: 8px 12px;
            min-width: 40px;
        }

        .pagination button.active {
            background: #764ba2;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: white;
        }

        .empty-state h2 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }

        .empty-state p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: white;
            padding: 0;
            border-radius: 10px;
            width: 90%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.3s ease-out;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .modal-close {
            background: transparent;
            color: white;
            font-size: 1.5em;
            cursor: pointer;
            border: none;
            padding: 0;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: none;
            box-shadow: none;
        }

        .modal-body {
            padding: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .modal-preview {
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 5em;
        }

        .modal-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal-details h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .detail-row {
            margin-bottom: 20px;
        }

        .detail-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            font-size: 0.9em;
            text-transform: uppercase;
            color: #667eea;
        }

        .detail-value {
            color: #666;
            word-break: break-word;
        }

        .tag {
            display: inline-block;
            background: #e0e0e0;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            margin-right: 8px;
            margin-bottom: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .btn-info {
            background: #17a2b8;
        }

        .btn-info:hover {
            box-shadow: 0 5px 15px rgba(23, 162, 184, 0.4);
        }

        .loading {
            display: none;
            text-align: center;
            padding: 40px;
            color: white;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .search-controls {
                grid-template-columns: 1fr;
            }

            .search-button-group {
                grid-column: 1 / -1;
                flex-direction: column;
            }

            .search-button-group button {
                width: 100%;
            }

            .media-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 15px;
            }

            .results-info {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .modal-body {
                grid-template-columns: 1fr;
            }

            .modal-preview {
                height: 300px;
            }

            .modal-header {
                padding: 20px;
            }

            .modal-body {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Royalty-Free Media Search</h1>
            <p>Search for free images, videos, and music for your projects</p>
        </header>

        <div class="search-section">
            <div class="search-controls">
                <div class="form-group">
                    <label for="searchInput">Search Term</label>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Enter your search query..."
                    >
                </div>
                <div class="form-group">
                    <label for="mediaType">Media Type</label>
                    <select id="mediaType">
                        <option value="">All Types</option>
                        <option value="image">Images</option>
                        <option value="video">Videos</option>
                        <option value="audio">Audio</option>
                    </select>
                </div>
            </div>

            <div class="search-button-group">
                <button id="searchBtn" class="btn-primary">🔍 Search</button>
                <button id="clearBtn" class="btn-secondary">✕ Clear</button>
            </div>

            <div class="filter-chips" id="filterChips"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Searching for royalty-free media...</p>
        </div>

        <div id="resultsContainer">
            <div class="results-info">
                <div class="results-count">
                    Results: <strong id="resultCount">0</strong> items found
                </div>
                <div>
                    <span id="pageInfo">Page 1</span>
                </div>
            </div>

            <div class="media-grid" id="mediaGrid"></div>

            <div class="pagination" id="pagination"></div>
        </div>

        <div class="empty-state" id="emptyState" style="display: none;">
            <h2>No Results Found</h2>
            <p>Try adjusting your search terms or filters</p>
        </div>
    </div>

    <!-- Modal for detailed view -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Media Details</h2>
                <button class="modal-close" id="modalClose">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-preview" id="modalPreview"></div>
                <div class="modal-details">
                    <h3>Details</h3>
                    <div class="detail-row">
                        <div class="detail-label">Type</div>
                        <div class="detail-value" id="detailType"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">License</div>
                        <div class="detail-value" id="detailLicense"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Source</div>
                        <div class="detail-value" id="detailSource"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Size</div>
                        <div class="detail-value" id="detailSize"></div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Duration</div>
                        <div class="detail-value" id="detailDuration">N/A</div>
                    </div>
                    <div class="detail-row">
                        <div class="detail-label">Tags</div>
                        <div class="detail-value" id="detailTags"></div>
                    </div>
                    <div class="modal-actions">
                        <button id="downloadBtn" class="btn-info">⬇️ Download</button>
                        <button id="shareBtn" class="btn-primary">📤 Share</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // State management
        const state = {
            allMedia: [],
            filteredMedia: [],
            currentPage: 1,
            itemsPerPage: 12,
            searchQuery: '',
            mediaTypeFilter: '',
            currentDetailModal: null
        };

        // Mock data generator
        function generateMockMediaData() {
            const titles = [
                'Mountain Landscape', 'Ocean Waves', 'Forest Path', 'Sunset Beach',
                'City Skyline', 'Northern Lights', 'Desert Dunes', 'Starry Night',
                'Rainy Day', 'Waterfall', 'Snow Peak', 'Tropical Island',
                'Urban Street', 'Garden Flowers', 'Modern Office', 'Nature Trail'
            ];

            const sources = ['Unsplash', 'Pixabay', 'Pexels', 'Freepik', 'Pixabay', 'Unsplash'];
            const licenses = ['CC0', 'CC BY', 'CC BY-SA', 'Creative Commons', 'Public Domain'];
            const types = ['image', 'image', 'image', 'video', 'audio'];
            const tags = ['nature', 'landscape', 'outdoor', 'city', 'urban', 'travel', 'water', 'sky'];

            const media = [];
            for (let i = 0; i < 48; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                media.push({
                    id: i + 1,
                    title: `${titles[i % titles.length]} #${Math.floor(i / titles.length) + 1}`,
                    type: type,
                    source: sources[Math.floor(Math.random() * sources.length)],
                    license: licenses[Math.floor(Math.random() * licenses.length)],
                    url: `https://picsum.photos/400/300?random=${i}`,
                    size: `${Math.floor(Math.random() * 50) + 5}MB`,
                    duration: type === 'video' ? `${Math.floor(Math.random() * 300) + 30}s` : null,
                    downloadUrl: `#download-${i}`,
                    tags: tags.sort(() => Math.random() - 0.5).slice(0, 3)
                });
            }
            return media;
        }

        // Helper Functions
        function initializeApp() {
            state.allMedia = generateMockMediaData();
            state.filteredMedia = [...state.allMedia];
            setupEventListeners();
            displayResults();
        }

        function setupEventListeners() {
            document.getElementById('searchBtn').addEventListener('click', performSearch);
            document.getElementById('clearBtn').addEventListener('click', clearFilters);
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') performSearch();
            });
            document.getElementById('mediaType').addEventListener('change', performSearch);
            document.getElementById('modalClose').addEventListener('click', closeModal);
            document.getElementById('downloadBtn').addEventListener('click', handleDownload);
            document.getElementById('shareBtn').addEventListener('click', handleShare);

            // Close modal when clicking outside
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') closeModal();
            });
        }

        function performSearch() {
            state.currentPage = 1;
            state.searchQuery = document.getElementById('searchInput').value.toLowerCase();
            state.mediaTypeFilter = document.getElementById('mediaType').value;

            state.filteredMedia = state.allMedia.filter(item => {
                const matchesQuery = state.searchQuery === '' || 
                    item.title.toLowerCase().includes(state.searchQuery) ||
                    item.tags.some(tag => tag.includes(state.searchQuery));
                
                const matchesType = state.mediaTypeFilter === '' || 
                    item.type === state.mediaTypeFilter;

                return matchesQuery && matchesType;
            });

            updateFilterChips();
            displayResults();
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('mediaType').value = '';
            state.currentPage = 1;
            state.searchQuery = '';
            state.mediaTypeFilter = '';
            state.filteredMedia = [...state.allMedia];
            updateFilterChips();
            displayResults();
        }

        function updateFilterChips() {
            const chipsContainer = document.getElementById('filterChips');
            chipsContainer.innerHTML = '';

            if (state.searchQuery) {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerHTML = `Search: "${state.searchQuery}" <span class="chip-remove">×</span>`;
                chip.querySelector('.chip-remove').addEventListener('click', clearFilters);
                chipsContainer.appendChild(chip);
            }

            if (state.mediaTypeFilter) {
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerHTML = `Type: ${state.mediaTypeFilter} <span class="chip-remove">×</span>`;
                chip.querySelector('.chip-remove').addEventListener('click', clearFilters);
                chipsContainer.appendChild(chip);
            }
        }

        function displayResults() {
            const grid = document.getElementById('mediaGrid');
            const emptyState = document.getElementById('emptyState');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultCount = document.getElementById('resultCount');

            if (state.filteredMedia.length === 0) {
                grid.innerHTML = '';
                resultsContainer.style.display = 'none';
                emptyState.style.display = 'block';
                return;
            }

            resultsContainer.style.display = 'block';
            emptyState.style.display = 'none';

            // Calculate pagination
            const totalPages = Math.ceil(state.filteredMedia.length / state.itemsPerPage);
            const startIdx = (state.currentPage - 1) * state.itemsPerPage;
            const endIdx = startIdx + state.itemsPerPage;
            const pageItems = state.filteredMedia.slice(startIdx, endIdx);

            // Update result count
            resultCount.textContent = state.filteredMedia.length;
            document.getElementById('pageInfo').textContent = 
                `Page ${state.currentPage} of ${totalPages}`;

            // Render media cards
            grid.innerHTML = pageItems.map(item => `
                <div class="media-card" data-id="${item.id}">
                    <div class="media-thumbnail">
                        <img src="${item.url}" alt="${item.title}" onerror="this.parentElement.textContent = '${getMediaIcon(item.type)}'">
                    </div>
                    <div class="media-info">
                        <div class="media-type">${item.type.toUpperCase()}</div>
                        <div class="media-title">${item.title}</div>
                        <div class="media-license">${item.license}</div>
                        <div class="media-source">Source: ${item.source}</div>
                    </div>
                </div>
            `).join('');

            // Add click listeners to cards
            document.querySelectorAll('.media-card').forEach(card => {
                card.addEventListener('click', () => {
                    const id = parseInt(card.dataset.id);
                    const media = state.allMedia.find(m => m.id === id);
                    openModal(media);
                });
            });

            // Render pagination
            renderPagination(totalPages);
        }

        function getMediaIcon(type) {
            const icons = {
                'image': '🖼️',
                'video': '🎥',
                'audio': '🎵'
            };
            return icons[type] || '📄';
        }

        function renderPagination(totalPages) {
            const paginationContainer = document.getElementById('pagination');
            paginationContainer.innerHTML = '';

            if (totalPages <= 1) return;

            // Previous button
            const prevBtn = document.createElement('button');
            prevBtn.textContent = '← Previous';
            prevBtn.disabled = state.currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (state.currentPage > 1) {
                    state.currentPage--;
                    displayResults();
                    scrollToTop();
                }
            });
            paginationContainer.appendChild(prevBtn);

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= state.currentPage - 1 && i <= state.currentPage + 1)) {
                    const pageBtn = document.createElement('button');
                    pageBtn.textContent = i;
                    pageBtn.classList.toggle('active', i === state.currentPage);
                    pageBtn.addEventListener('click', () => {
                        state.currentPage = i;
                        displayResults();
                        scrollToTop();
                    });
                    paginationContainer.appendChild(pageBtn);
                } else if (i === state.currentPage - 2 || i === state.currentPage + 2) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.style.padding = '8px 12px';
                    dots.style.color = 'white';
                    paginationContainer.appendChild(dots);
                }
            }

            // Next button
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next →';
            nextBtn.disabled = state.currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (state.currentPage < totalPages) {
                    state.currentPage++;
                    displayResults();
                    scrollToTop();
                }
            });
            paginationContainer.appendChild(nextBtn);
        }

        function openModal(media) {
            state.currentDetailModal = media;
            const modal = document.getElementById('detailModal');
            const preview = document.getElementById('modalPreview');

            document.getElementById('modalTitle').textContent = media.title;
            
            preview.innerHTML = media.type === 'video' 
                ? `<video controls style="width:100%; height:100%;"><source src="${media.url}" type="video/mp4">Your browser does not support the video tag.</video>`
                : media.type === 'audio'
                ? `<audio controls style="width:100%;"><source src="${media.url}" type="audio/mpeg">Your browser does not support the audio element.</audio>`
                : `<img src="${media.url}" alt="${media.title}">`;

            document.getElementById('detailType').textContent = media.type.charAt(0).toUpperCase() + media.type.slice(1);
            document.getElementById('detailLicense').textContent = media.license;
            document.getElementById('detailSource').textContent = media.source;
            document.getElementById('detailSize').textContent = media.size;
            document.getElementById('detailDuration').textContent = media.duration || 'N/A';
            document.getElementById('detailTags').innerHTML = media.tags
                .map(tag => `<span class="tag">${tag}</span>`)
                .join('');

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
            state.currentDetailModal = null;
        }

        function handleDownload() {
            if (state.currentDetailModal) {
                alert(`Download started for: ${state.currentDetailModal.title}\n\nFile: ${state.currentDetailModal.downloadUrl}`);
                closeModal();
            }
        }

        function handleShare() {
            if (state.currentDetailModal) {
                const shareText = `Check out this royalty-free media: ${state.currentDetailModal.title} from ${state.currentDetailModal.source}`;
                
                if (navigator.share) {
                    navigator.share({
                        title: 'Royalty-Free Media',
                        text: shareText,
                        url: window.location.href
                    }).catch(err => console.log('Error sharing:', err));
                } else {
                    alert(shareText);
                }
            }
        }

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initialize the app on page load
        window.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
